[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

[server]
# Always 8501: the shared Cloudflare tunnel points here. Never start a second instance on another port.
port = 8501
# Reload the app for every open browser as soon as a source file is saved.
runOnSave = true

# ------------------------------------------------------------------ Design tokens (see DESIGN.md)
# Colour values mirror src/fieldshift/ui_theme.py (TOKENS). Change both together.
# System fonts only: no web-font download on slow mobile data (docs/ux-guidelines.md).
[theme]
font = "system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif"
headingFont = "system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif"
# Tight 1.2 scale, fixed rem (h1 … h6). Base text stays at Streamlit's 16 px.
headingFontSizes = ["1.75rem", "1.375rem", "1.125rem", "1rem", "1rem", "1rem"]
headingFontWeights = [700, 700, 650, 600, 600, 600]
baseRadius = "0.5rem"
buttonRadius = "0.5rem"
showWidgetBorder = true

[theme.light]
primaryColor = "#2E5B44"
backgroundColor = "#FAFAF7"
secondaryBackgroundColor = "#EFEEE7"
textColor = "#1E231C"
linkColor = "#2E5B44"
borderColor = "#CFCDC2"
chartCategoricalColors = ["#1F6FB2", "#B3541E", "#2E5B44", "#8A6D1E"]

[theme.dark]
primaryColor = "#3F8160"
backgroundColor = "#121510"
secondaryBackgroundColor = "#1D211B"
textColor = "#ECEDE6"
linkColor = "#8FCDA8"
borderColor = "#3C4238"
chartCategoricalColors = ["#6FA8DC", "#E08A55", "#8FCDA8", "#D8B65A"]
