# Redeploys the public demo on Google Cloud Run after every push to main (decision 0008).
# Keyless: GitHub's OIDC token is exchanged through Workload Identity Federation for the
# github-deployer service account. The provider only accepts this repository on refs/heads/main,
# so no secret is stored in GitHub.
name: Deploy to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-cloud-run
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: farmlens-demo-2026
  REGION: europe-southwest1
  SERVICE: farmlens

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/530581375456/locations/global/workloadIdentityPools/github/providers/github-repo
          service_account: github-deployer@farmlens-demo-2026.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and deploy
        run: |
          gcloud run deploy "$SERVICE" --source . --region "$REGION" --project "$PROJECT_ID" \
            --allow-unauthenticated --no-cpu-throttling --min-instances 1 --max-instances 2 \
            --memory 512Mi --cpu 1 --timeout 300 --port 8080 --quiet

      - name: Smoke test
        run: |
          URL=$(gcloud run services describe "$SERVICE" --region "$REGION" --project "$PROJECT_ID" --format 'value(status.url)')
          curl -fsS --retry 5 --retry-delay 5 "$URL/api/health"
          curl -fsS -o /dev/null "$URL/"
          echo "Deployed: $URL"
